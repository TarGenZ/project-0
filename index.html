<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Search console verification — usually unnecessary here: verifying
         arpansarkar.org as a "Domain" property in Google Search Console via
         one DNS TXT record covers every *.arpansarkar.org subdomain at once.
         Uncomment only if this subdomain needs to be verified individually.
    <meta name="google-site-verification" content="PASTE_CODE_HERE" />
    <meta name="msvalidate.01" content="PASTE_CODE_HERE" />
    -->

    <!-- Primary SEO -->
    <title>Cutoffs — MBBS College Database & NEET Cutoffs | arpansarkar.org</title>
    <meta
      name="description"
      content="Browse 600+ MBBS colleges with real NEET cutoff data across every quota and round. Transparent 10-parameter ratings — location, fees, faculty, hostel and more — so you can choose the right college with confidence."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://collegedatabase.arpansarkar.org/" />
    <meta name="author" content="Arpan Sarkar" />
    <meta name="theme-color" content="#0A0F1E" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="collegedatabase.arpansarkar.org" />
    <meta property="og:title" content="Cutoffs — MBBS College Database & NEET Cutoffs" />
    <meta
      property="og:description"
      content="Browse 600+ MBBS colleges with real NEET cutoff data across every quota and round. Transparent ratings, no noise — just the data you need."
    />
    <meta property="og:url" content="https://collegedatabase.arpansarkar.org/" />
    <meta property="og:image" content="https://collegedatabase.arpansarkar.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cutoffs — MBBS College Database & NEET Cutoffs" />
    <meta
      name="twitter:description"
      content="Browse 600+ MBBS colleges with real NEET cutoff data across every quota and round. Transparent ratings, no noise."
    />
    <meta name="twitter:image" content="https://collegedatabase.arpansarkar.org/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts (also @imported in index.css — preconnect speeds up the first paint) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: what this site is, and who runs it -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cutoffs",
        "url": "https://collegedatabase.arpansarkar.org",
        "description": "India's MBBS college database — browse colleges, ratings, and NEET cutoffs across every quota and round.",
        "publisher": {
          "@type": "Person",
          "name": "Arpan Sarkar",
          "url": "https://arpansarkar.org"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Cutoffs — arpansarkar.org",

        "founder": {
          "@type": "Person",
          "name": "Arpan Sarkar"
        },

      }
    </script>
